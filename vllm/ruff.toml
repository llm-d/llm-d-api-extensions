line-length = 100
target-version = "py310"

[lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[lint.per-file-ignores]
# Tests deliberately poke at plugin internals (`_build_response`, ...).
"tests/**" = ["SIM117"]
