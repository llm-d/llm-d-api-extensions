name: CI - Lint and Format

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vllm
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      # Checks only, never modifies files in CI.
      - name: Run Ruff lint check
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.11"
          src: "./vllm"
          args: "check --output-format=full"

      - name: Run Ruff format check
        uses: astral-sh/ruff-action@v3
        with:
          version: "0.15.11"
          src: "./vllm"
          args: "format --check --diff"
