name: CI - Unit Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # vLLM changes underneath this package, so the contract tests also run
  # daily with no change here to catch an interface vLLM renamed or removed.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        vllm: [release]
        include:
          - python-version: "3.12"
            vllm: nightly
    # vLLM nightly breaking an interface should not block an unrelated PR. It
    # fails the scheduled run instead.
    continue-on-error: ${{ matrix.vllm == 'nightly' && github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' }}
    defaults:
      run:
        working-directory: vllm
    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }} (vLLM ${{ matrix.vllm }})
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # `vllm` is a heavyweight GPU oriented dependency and the unit tests only
      # need a handful of symbols from it (`vllm.logger`, `vllm.tasks`), so
      # install it on its own rather than pulling the whole project dependency
      # set through `pip install -e .`. The contract tests
      # (`test_vllm_contract.py`) import vLLM's real config classes.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.vllm }}" = "nightly" ]; then
            pip install --pre \
              --extra-index-url https://wheels.vllm.ai/nightly \
              --extra-index-url https://download.pytorch.org/whl/cpu vllm
          else
            pip install --extra-index-url https://download.pytorch.org/whl/cpu vllm
          fi
          pip show vllm | grep -i '^version'
          pip install fastapi 'pydantic>=2' pytest pytest-asyncio httpx

      # The opt-in e2e tests skip themselves unless RUN_VLLM_E2E is set. They
      # download model weights and launch a real server which CI does not do.
      - name: Run unit tests
        run: pytest tests/ -v
